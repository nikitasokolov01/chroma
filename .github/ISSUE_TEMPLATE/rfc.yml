# Template based on https://gitlab.archlinux.org/archlinux/rfcs/-/blob/0ba3b61e987e197f8d1901709409b8564958f78a/rfcs/0000-template.rst
name: Request for comment (RFC)
description: Propose a larger Chroma change and discuss its design
labels: [enhancement]
body:
- type: markdown
  attributes:
    value: |
      Use this form for a larger change to Chroma. Explain the user need, the proposed behavior, and how the change fits the existing Prism backend. Search [existing issues](https://github.com/nikitasokolov01/chroma/issues) for related proposals.
- type: textarea
  id: goal
  attributes:
    label: Goal
    description: Summarize the proposed outcome in one or two sentences.
  validations:
    required: true
- type: textarea
  id: motivation
  attributes:
    label: Motivation
    description: Explain the current problem and affected workflows. Link and summarize related discussions or examples.
  validations:
    required: true
- type: textarea
  id: specification
  attributes:
    label: Proposed design
    description: Describe the behavior and implementation approach. Include compatibility with existing profiles and workflows where relevant.
  validations:
    required: true
- type: textarea
  id: drawbacks
  attributes:
    label: Drawbacks and tradeoffs
    description: Describe costs, complexity, or workflows that could become harder.
  validations:
    required: true
- type: textarea
  id: unresolved-questions
  attributes:
    label: Unresolved questions
    description: List the decisions that need discussion. Write "None" if the proposal is complete.
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives considered
    description: Explain other approaches and why you prefer this one.
  validations:
    required: true
- type: checkboxes
  id: duplicate-check
  attributes:
    label: Existing proposals
    options:
    - label: I searched the Chroma issue tracker and did not find an existing proposal covering this change.
      required: true
