name: Bug report
description: Report a problem with Chroma
labels: [bug]
body:
- type: markdown
  attributes:
    value: |
      This tracker is for Chroma, including the v0.1.0 preview. Chroma is maintained independently of Prism Launcher.

      Check the [Chroma guide](https://github.com/nikitasokolov01/chroma/blob/main/docs/CHROMA.md) and [existing issues](https://github.com/nikitasokolov01/chroma/issues) before reporting a problem. Give the issue a descriptive title.
- type: dropdown
  id: operating-system
  attributes:
    label: Operating system
    description: Release packages currently target Windows x64. Include other systems if you built Chroma yourself.
    multiple: true
    options:
    - Windows
    - macOS
    - Linux
    - Other
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Chroma version
    description: Give the release tag, installer filename, or source commit. The underlying Prism version may be shown separately.
    placeholder: v0.1.0 preview
  validations:
    required: true
- type: dropdown
  id: installation
  attributes:
    label: Installation type
    options:
    - Windows installer
    - Portable ZIP
    - Built from source
    - Other
  validations:
    required: true
- type: input
  id: qt-version
  attributes:
    label: Qt version
    description: Optional. Include this if available in the launcher's About dialog.
    placeholder: Qt 6.5.3
- type: textarea
  id: behavior
  attributes:
    label: Expected and actual behavior
    description: What did you expect, and what happened instead?
    placeholder: The selected instance should remain visible after resizing the window, but its card is clipped.
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Steps to reproduce
    description: Include the relevant window size, provider, or instance settings. If this is a game-launch problem, mention the Minecraft version and mod loader.
    placeholder: |
      1. Open the library.
      2. Select an instance.
      3. Resize the window to 680 x 640.
  validations:
    required: true
- type: textarea
  id: context
  attributes:
    label: Screenshots, logs, and other context
    description: Attach relevant screenshots or sanitized logs. Do not attach accounts.json, access tokens, or Microsoft sign-in codes. If you tested the same behavior in Prism, include that result.
- type: checkboxes
  id: duplicate-check
  attributes:
    label: Existing reports
    options:
    - label: I searched the Chroma issue tracker and did not find an existing report of this problem.
      required: true
