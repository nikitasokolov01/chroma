name: Feature suggestion
description: Suggest a feature or improvement for Chroma
labels: [enhancement]
body:
- type: markdown
  attributes:
    value: |
      Suggest an improvement for Chroma. Search the [existing issues](https://github.com/nikitasokolov01/chroma/issues) first; use the RFC form for larger architectural changes.
- type: input
  id: use-case
  attributes:
    label: Use case
    description: How do you use Chroma, and what are you trying to do?
    placeholder: I switch between several modpacks every day.
  validations:
    required: true
- type: textarea
  id: suggestion
  attributes:
    label: Suggested change
    description: Describe the behavior you want.
    placeholder: Let me reorder pinned instances by dragging their sidebar icons.
  validations:
    required: true
- type: textarea
  id: benefit
  attributes:
    label: Benefit
    description: How would this improve your workflow?
    placeholder: I could keep my current modpacks at the top of the sidebar.
  validations:
    required: true
- type: checkboxes
  id: duplicate-check
  attributes:
    label: Existing suggestions
    options:
    - label: I searched the Chroma issue tracker and did not find an existing suggestion covering this change.
      required: true
- type: textarea
  id: context
  attributes:
    label: Additional context
    description: Add examples, sketches, or related discussions if helpful.
